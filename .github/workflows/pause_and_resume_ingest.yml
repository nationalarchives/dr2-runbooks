name: Pause and resume ingest
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment'
        required: true
        options:
          - intg
          - staging
          - prod
        default: 'intg'
      pause:
        type: choice
        description: 'Choose true to pause ingests and false to resume'
        required: true
        options:
          - 'true'
          - 'false'
env:
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  PAUSE: ${{ github.event.inputs.pause }}
run-name: Running pause and resume with pause set to ${{inputs.pause}} on ${{inputs.environment}}
permissions:
  id-token: write
  contents: write
jobs:
  pause_and_resume:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/${{ github.event.inputs.environment }}-dr2-runbook-pause-ingest
          aws-region: eu-west-2
          role-session-name: PauseIngest
      - run: aws lambda invoke --function-name $ENVIRONMENT-dr2-pause-ingest --cli-binary-format raw-in-base64-out --payload "{\"pause\":$PAUSE}" out
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/${{ github.event.inputs.environment }}-dr2-runbook-pause-preservica-activity
          aws-region: eu-west-2
          role-session-name: PausePreservicaActivity
      - run: aws lambda invoke --function-name $ENVIRONMENT-dr2-pause-preservica-activity --cli-binary-format raw-in-base64-out --payload "{\"pause\":$PAUSE}" out
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        if: github.event.inputs.pause == 'false'
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/${{ github.event.inputs.environment }}-dr2-runbook-kickstart-ingest-flow-control
          aws-region: eu-west-2
          role-session-name: KickstartIngestFlowControl
      - run: aws lambda invoke --function-name ${{ github.event.inputs.environment }}-dr2-ingest-flow-control --cli-binary-format raw-in-base64-out --payload '{"executionName":"MANUAL_RESTART", "taskToken":""}' out
        if: github.event.inputs.pause == 'false'

